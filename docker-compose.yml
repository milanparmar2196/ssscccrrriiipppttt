# Local development infrastructure (confirmed stack, 2026-10-27).
# Postgres carries the pgvector extension (A2: vectors live in the main DB).
# Redis serves BullMQ queues + rate-limit/session storage.
# MinIO provides the S3-compatible object store locally (deploy: R2/S3 via env).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scriptwriter
      POSTGRES_PASSWORD: scriptwriter
      POSTGRES_DB: scriptwriter
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptwriter -d scriptwriter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scriptwriter
      MINIO_ROOT_PASSWORD: scriptwriter-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  redis_data:
  minio_data:
